<div class="explorer">
  <div class="explorer__filters">
    <div class="field">
      <label for="explorer-search">{{ labels.search }}</label>
      <input id="explorer-search" class="input" type="search" autocomplete="off" [value]="queryInput()"
        [attr.placeholder]="labels.searchHint" (input)="onSearch($any($event.target).value)" />
    </div>
    <div class="field" role="radiogroup" aria-labelledby="explorer-type-label">
      <span id="explorer-type-label" class="explorer__label">{{ labels.type }}</span>
      <div class="chips">
        @for (option of typeOptions; track option.id) {
          <button type="button" role="radio" class="chip" [attr.aria-checked]="type() === option.id"
            [tabIndex]="type() === option.id ? 0 : -1" (click)="type.set(option.id)">{{ option.label }}</button>
        }
      </div>
    </div>
    <div class="field">
      <label for="explorer-scanner">{{ labels.scanner }}</label>
      <select id="explorer-scanner" class="input" (change)="onScanner($any($event.target).value)">
        <option value="" [selected]="scanner() === null">{{ labels.scannerAll }}</option>
        @for (s of copy.scanners; track s.key) {
          <option [value]="s.key" [selected]="scanner() === s.key">{{ s.label }}</option>
        }
      </select>
    </div>
  </div>

  @if (highlight(); as h) {
    <div class="explorer__highlight" role="status">
      <span>{{ highlightText() }}</span>
      <button type="button" class="btn btn--ghost btn--small" (click)="highlight.set(null)">{{ labels.clearHighlight }}</button>
    </div>
  }

  <app-tabs [tabs]="tabs()" [label]="labels.tablist" prefix="std" [(selected)]="standard">
    <p class="explorer__count" aria-hidden="true">{{ count() }}</p>
    @if (visible().length) {
      <ul class="plain-list explorer__list">
        @for (row of visible(); track row.standard + row.id) {
          <li>
            <app-control-row [row]="row" [labels]="labels" [scanners]="copy.scanners"
              [highlighted]="highlightIds().has(row.standard + ':' + row.id)" (highlightScanner)="highlight.set($event)" />
          </li>
        }
      </ul>
    } @else {
      <div class="explorer__empty">
        <p>{{ labels.empty }}</p>
        <button type="button" class="btn btn--ghost btn--small" (click)="clear()">{{ labels.clear }}</button>
      </div>
    }
  </app-tabs>

  <p class="footnote explorer__note">{{ labels.note }}</p>
</div>
