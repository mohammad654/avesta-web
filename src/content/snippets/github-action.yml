# Avesta Proof in GitHub Actions.
#
# Two jobs on purpose:
#   * every push to the default branch records a signed report in the ledger;
#   * every pull request is judged only on what it adds, so legacy debt never
#     blocks a merge.
#
# Copy to .github/workflows/avesta-proof.yml
#
# Actions are pinned to a full commit SHA (the version is in the comment):
# a tag can be moved to different code, a commit cannot. Dependabot keeps
# the pins up to date.

name: avesta-proof

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write      # only needed for the PR comment
  security-events: write    # only needed to upload SARIF

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0          # the change-risk scanner reads git history

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Avesta Proof and the scanners
        run: pip install "avesta-proof[scanners,signing]"

      # The output folder must survive between runs: it holds the hash-chained
      # ledger and the snapshots the before/after comparison is built from.
      - name: Restore the evidence ledger
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: proof
          key: avesta-proof-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: avesta-proof-${{ github.ref_name }}-

      - name: Scan
        run: |
          avesta-proof scan . -o proof \
            --format html,json,sarif,sbom,plan,vex \
            --baseline auto \
            --profile saas
        env:
          # Set this to sign the report. Generate with: avesta-proof keygen
          AVESTA_SIGNING_KEY: ${{ secrets.AVESTA_SIGNING_KEY }}

      - name: Comment on the pull request
        if: github.event_name == 'pull_request'
        run: |
          avesta-proof pr-comment proof/report.json --fail-on high -o comment.md || true
          gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Block the pull request on what it adds
        if: github.event_name == 'pull_request'
        run: avesta-proof pr-comment proof/report.json --fail-on high -o /dev/null

      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9  # v3.39.3
        with:
          sarif_file: proof/report.sarif

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: avesta-proof-evidence
          path: proof
          retention-days: 90
